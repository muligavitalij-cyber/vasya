<script>
const CH={pi:Math.PI,e:Math.E},R=a=>a*Math.PI/180;
const F={sqrt:Math.sqrt,abs:Math.abs,log:Math.log10,ln:Math.log,sin:a=>Math.sin(R(a)),cos:a=>Math.cos(R(a)),tan:a=>Math.tan(R(a))};

const fmt=v=>Math.abs(v-Math.round(v))<1e-9?String(Math.round(v)):String(+v.toFixed(4));
const CY="а-яіїєґ",has=(q,w)=>new RegExp("(?<![" + CY + "])"+w).test(q);
const PH={

const res=v=>rnd(["Відповідь: ","Виходить ","Порахував: "])+v;
const TH={"остач":"Остача — це те, що залишається після ділення, якщо число не ділиться націло.","порядок дій":"Спочатку дужки, потім множення й ділення, потім додавання й віднімання.","дискримінант":"Для ax²+bx+c=0: D=b²−4ac. D>0 — два корені, D=0 — один, D<0 — дійсних коренів немає. x=(−b±√D)/(2a).","піфагор":"У прямокутному трикутнику c²=a²+b², де c — гіпотенуза.","периметр":"Периметр — сума довжин усіх сторін фігури.","коло":"Довжина кола C=2πr, площа круга S=πr².","площ":"Площа: прямокутник a·b, трикутник ½·a·h, круг πr², трапеція (a+b)/2·h.","відсот":"1% — це сота частина числа. p% від N = N·p/100.","пропорц":"Пропорція a/b=c/d. Головна властивість: a·d=b·c.","рівняння":"Рівняння — рівність з невідомим. Переносимо доданки й ділимо на коефіцієнт.","степен":"Степінь aⁿ — це a, помножене само на себе n разів. xᵐ·xⁿ=xᵐ⁺ⁿ, xᵐ:xⁿ=xᵐ⁻ⁿ, (xᵐ)ⁿ=xᵐⁿ, (ab)ⁿ=aⁿbⁿ, a⁰=1.","одночлен":"Одночлен — добуток чисел і змінних у степенях, наприклад 5a²b. Число попереду — коефіцієнт. Одночлени з однаковою буквеною частиною — подібні.","многочлен":"Многочлен — сума одночленів, наприклад x²−5x+6. Щоб помножити многочлени, множимо кожен член на кожен і зводимо подібні доданки.","подібні":"Подібні доданки мають однакову буквену частину. Їх зводимо додаванням коефіцієнтів: 3a+2a=5a.","скорочен":"(a+b)²=a²+2ab+b², (a−b)²=a²−2ab+b², (a−b)(a+b)=a²−b².","дріб":"Дріб a/b — це a, поділене на b. Скорочуємо діленням чисельника й знаменника на спільний дільник. Додаємо через спільний знаменник."};
const UN=[{мм:.001,см:.01,дм:.1,м:1,км:1000},{г:.001,кг:1,ц:100,т:1000},{с:1,хв:60,год:3600,доб:86400}];
const AL=[["міліметр","мм"],["сантиметр","см"],["дециметр","дм"],["кілометр","км"],["метр","м"],["кілограм","кг"],["грам","г"],["центнер","ц"],["тон","т"],["секунд","с"],["хвилин","хв"],["годин","год"],["доб","доб"]];

function prep(s){s=s.toLowerCase().replace(/×|•/g,"*").replace(/÷|:/g,"/").replace(/−/g,"-").replace(/\*\*/g,"^").replace(/π/g,"pi");

const side=(s,v={})=>parse(prep(s),{...CH,...v});

function solveSys(eq){const e=eq.split(";").filter(x=>x.includes("="));if(e.length!=2)return null;
const rows=e.map(t=>{const[l,r]=t.split("="),g=(x,y)=>side(l,{x,y})-side(r,{x,y}),c=g(0,0);return[g(1,0)-c,g(0,1)-c,-c]});

const gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a/gcd(a,b)*b;

const un=u=>{for(const[p,a]of AL)if(u.startsWith(p))return a;return u},v=parseFloat(m[1].replace(",",".")),a=un(m[2]),b=un(m[3]);
for(const g of UN)if(a in g&&b in g)return`${fmt(v)} ${a} = ${fmt(v*g[a]/g[b])} ${b}`;return null}

function geo(q,n){const k=n.length,pi=Math.PI,p=q.includes("периметр"),s=q.includes("площ"),vol=/об'?єм/.test(q),sf=q.includes("поверхн");
const pair=(nm,P,S)=>p&&!s?`Периметр ${nm} = ${fmt(P)}`:s&&!p?`Площа ${nm} = ${fmt(S)}`:`${nm}: периметр = ${fmt(P)}, площа = ${fmt(S)}`;
const solid=(nm,V,S)=>vol&&!sf?`Об’єм ${nm} = ${fmt(V)}`:sf&&!vol?`Площа поверхні ${nm} = ${fmt(S)}`:`${nm}: об’єм = ${fmt(V)}, площа поверхні = ${fmt(S)}`;
if((q.includes("гіпотенуз")||q.includes("катет"))&&k>=2){
if(q.includes("гіпотенуз")&&q.includes("катет")&&!/катети|катетів/.test(q)){const h=Math.max(n[0],n[1]),l=Math.min(n[0],n[1]);return"Другий катет = "+fmt(Math.sqrt(h*h-l*l))}

if(/куля|кулі|кулю|сфер/.test(q)&&k>=1){const r=n[0];return solid("кулі",4/3*pi*r**3,4*pi*r*r)}
if(q.includes("циліндр")&&k>=2){const[r,h]=n;return solid("циліндра",pi*r*r*h,2*pi*r*(r+h))}

if(/паралелепіпед|коробк|бруск/.test(q)&&k>=3){const[a,b,c]=n;return solid("паралелепіпеда",a*b*c,2*(a*b+b*c+a*c))}

return lw&&!s?"Довжина кола = "+fmt(L):s&&!lw?"Площа круга = "+fmt(S):`Довжина кола = ${fmt(L)}, площа = ${fmt(S)}`}

if(q.includes("трикутник")){
if(k>=3){const[a,b,c]=n;if(p&&!s)return"Периметр трикутника = "+fmt(a+b+c);

if(k==2&&s)return"Площа трикутника = "+fmt(n[0]*n[1]/2)}
if(q.includes("трапец")&&k>=3)return"Площа трапеції = "+fmt((n[0]+n[1])/2*n[2]);
if(q.includes("паралелограм")&&k>=2)return p?"Периметр паралелограма = "+fmt(2*(n[0]+n[1])):"Площа паралелограма = "+fmt(n[0]*n[1]);

return null}

const SUP="⁰¹²³⁴⁵⁶⁷⁸⁹",sup=n=>n==1?"":n<0?"^"+n:String(n).split("").map(d=>SUP[d]).join("");
const rat=x=>{if(Number.isInteger(x))return String(x);for(let d=2;d<=1000;d++){const n=x*d;if(Math.abs(n-Math.round(n))<1e-9)return Math.round(n)+"/"+d}return null},fr=x=>rat(x)||fmt(x);
const mk=(c,k="")=>c?{[k]:c}:{},kp=k=>k?k.split(",").map(t=>{const[v,e]=t.split(":");return[v,+e]}):[],ks=a=>a.filter(t=>t[1]).sort((x,y)=>x[0]<y[0]?-1:1).map(t=>t.join(":")).join(",");
const isC=a=>Object.keys(a).every(k=>k===""),cv=a=>a[""]||0;
const padd=(a,b,s=1)=>{const r={...a};for(const k in b){r[k]=(r[k]||0)+s*b[k];if(Math.abs(r[k])<1e-12)delete r[k]}return r};
const pmul=(a,b)=>{const r={};for(const i in a)for(const j in b){const o={};kp(i).concat(kp(j)).forEach(([v,e])=>o[v]=(o[v]||0)+e);const k=ks(Object.entries(o));r[k]=(r[k]||0)+a[i]*b[j]}for(const k in r)if(Math.abs(r[k])<1e-12)delete r[k];return r};
const pinv=a=>{const k=Object.keys(a);if(k.length!=1)throw"div";return{[ks(kp(k[0]).map(([v,e])=>[v,-e]))]:1/a[k[0]]}};
const ppow=(a,n)=>{if(!Number.isInteger(n)||Math.abs(n)>30)throw"pow";if(n<0)return ppow(pinv(a),-n);let r={"":1};for(let i=0;i<n;i++)r=pmul(r,a);return r};
const pprep=s=>s.toLowerCase().replace(/(?<![а-яіїєґ])х(?![а-яіїєґ])/g,"x").replace(/×|•|·/g,"*").replace(/÷|:/g,"/").replace(/−/g,"-").replace(/\*\*/g,"^").replace(/(\d),(?=\d)/g,"$1.").replace(/(?<=\d)\s*x\s*(?=\d)/g,"*").replace(/([a-z0-9)])\s*(?=[a-z(])/g,"$1*").trim();
function pp(s){let i=0;const ws=()=>{while(s[i]==" ")i++};
const ex=()=>{let v=tm();ws();while(s[i]=="+"||s[i]=="-"){const o=s[i++];v=padd(v,tm(),o=="+"?1:-1);ws()}return v};
const tm=()=>{let v=un();ws();while(s[i]=="*"||s[i]=="/"){const o=s[i++],r=un();v=o=="*"?pmul(v,r):pmul(v,pinv(r));ws()}return v};
const un=()=>{ws();if(s[i]=="-"){i++;return pmul({"":-1},un())}if(s[i]=="+"){i++;return un()}return pw()};
const pw=()=>{const b=at();ws();if(s[i]=="^"){i++;const e=un();if(!isC(e))throw"pow";const n=cv(e);return isC(b)&&(!Number.isInteger(n)||n<0)?mk(cv(b)**n):ppow(b,n)}return b};
const at=()=>{ws();if(s[i]=="("){i++;const v=ex();ws();if(s[i]!=")")throw 0;i++;return v}
let m=/^\d+(\.\d+)?/.exec(s.slice(i));if(m){i+=m[0].length;return mk(+m[0])}
m=/^[a-z]/.exec(s.slice(i));if(m){i++;return mk(1,m[0]+":1")}throw 0};
const v=ex();ws();if(i<s.length)throw 0;return v}
function pf(p){const K=Object.keys(p);if(!K.length)return"0";

return t.map((x,i)=>{const a=Math.abs(x.c),vs=x.v.map(([v,e])=>v+sup(e)).join(""),cs=a==1&&vs?"":(!Number.isInteger(a)&&rat(a)&&vs?"("+rat(a)+")":fr(a)),c=cs+vs;return i?(x.c<0?" − ":" + ")+c:(x.c<0?"−":"")+c}).join("")}
function fac(p){const T=Object.keys(p).map(k=>({c:p[k],v:kp(k)}));if(!T.length||!T.every(t=>Number.isInteger(t.c)))return null;
if(T.length==1)return pf(p)+" — це вже одночлен.";
const g=T.reduce((a,t)=>gcd(a,Math.abs(t.c)),0),V=[...new Set(T.flatMap(t=>t.v.map(x=>x[0])))];
const mo=V.map(v=>[v,Math.min(...T.map(t=>(t.v.find(x=>x[0]==v)||[0,0])[1]))]).filter(x=>x[1]>0),gm={[ks(mo)]:g},R=pmul(p,pinv(gm)),pre=ks(mo)===""&&g==1?"":pf(gm);
